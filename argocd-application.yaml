apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zaqmlp523/devops.git
    targetRevision: main
    path: guestbook/k8s          # 이 폴더의 YAML을 적용
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true                # Git에서 지우면 클러스터에서도 삭제
      selfHeal: true             # 손으로 바꾸면 Git 상태로 원복
